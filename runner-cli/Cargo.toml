[package]
name = "runner-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
common = { version = "0.1.0", path = "../common" }
runner-core = { version = "0.1.0", path = "../runner-core" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"

[dev-dependencies]
bytes = "1.12.1"
common = { path = "../common", features = ["mock"] }
tempfile = "3.27.0"
