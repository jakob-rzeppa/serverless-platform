# Local stack: Kafka + Garage + runner-http.
#
#   docker compose up -d --build        # everything
#   docker compose up -d kafka garage   # only infrastructure, run runner-http with `cargo run`
#
# From the host: Kafka at localhost:9092, Garage S3 at http://localhost:3900,
# runner-http at http://<subdomain>.apps.localhost:8080. The dev S3 key below
# matches the defaults in the root .env.

name: serverless-platform

x-dev-s3: &dev-s3
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  S3_ACCESS_KEY: GK0123456789abcdef01234567
  S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  ARTIFACT_BUCKET: apps
  LOG_BUCKET: logs

x-runner: &runner
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    garage-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for containers, EXTERNAL for `cargo run` on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by kafka-init with the right settings.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    # No volume: the image runs as a non-root user and a fresh volume would be
    # root-owned. Data survives restarts, not `docker compose down`;
    # kafka-init recreates the topics, then redeploy your apps.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:29092"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        topics=/opt/kafka/bin/kafka-topics.sh
        create() { "$$topics" --bootstrap-server kafka:29092 --create --if-not-exists --replication-factor 1 "$$@"; }
        # Desired state: compacted, so a starting runner-http replays one message per app.
        create --topic http.deploy --partitions 3 --config cleanup.policy=compact
        "$$topics" --bootstrap-server kafka:29092 --list

  garage:
    image: dxflrs/garage:v2.1.0
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # admin API
    volumes:
      - ./deploy/local/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell; `garage status` exits 0 once the node answers RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  garage-init:
    # The garage image is FROM scratch; the init script needs a shell.
    build:
      dockerfile_inline: |
        FROM dxflrs/garage:v2.1.0 AS garage
        FROM alpine:3.22
        COPY --from=garage /garage /usr/local/bin/garage
    depends_on:
      garage:
        condition: service_healthy
    # Same network namespace and metadata as the node, so the CLI connects
    # to it like `docker exec garage /garage ...` would.
    network_mode: service:garage
    volumes:
      - ./deploy/local/garage.toml:/etc/garage.toml:ro
      - ./deploy/local/garage-init.sh:/garage-init.sh:ro
      - garage-meta:/var/lib/garage/meta
    environment: *dev-s3
    entrypoint: ["/bin/sh", "/garage-init.sh"]

  runner-http:
    <<: *runner
    build:
      context: .
      dockerfile: runner-http/Dockerfile
    image: serverless-platform/runner-http:dev
    environment:
      <<: *dev-s3
      KAFKA_BROKERS: kafka:29092
      APPS_DOMAIN: apps.localhost
      POD_NAME: runner-http
      RUST_LOG: info,librdkafka=warn
    ports:
      - "8080:8080"
    volumes:
      - runner-http-cache:/var/cache/runner-http

volumes:
  garage-meta:
  garage-data:
  runner-http-cache:
